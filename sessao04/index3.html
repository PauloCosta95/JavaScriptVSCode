<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seção 04 - Aula 03</title>
</head>
<body>
  <h1>Seção 04 - Aula 03</h1>

  <script>
    var idade = 18; //number (int, float, double)

    if(idade >= 18){
      console.log("Maior de idade");
    } else {
      console.log("Menor de idade");
    }

    if(idade <= 14){
      console.log("Criança");
    } else if(idade < 18){
      console.log("Adolescente");
    } else {
      console.log("Adulto");
    }

    //Dica Geek (verifica valor)
    if(1 == "1"){
      console.log("sim 1 == '1'");
    } else {
      console.log("Não");
    }

    //Dica Geek 2 (verifica valor e tipo de dados)
    if(1 === "1"){
      console.log("sim 1 === '1'");
    } else {
      console.log("Não");
    }

        var value = 42;
    var stringValue = "42";

    //Dica Geek (verifica valor)
    if(value == stringValue){
      console.log("sim 42 == '42'");
    } else {
      console.log("Não");
    }

    //Dica Geek 2 (verifica valor e tipo de dados)
    if(value === stringValue){
      console.log("sim 42 == '42'");
    } else {
      console.log("Não");
    }


    var sexo = "M";

    switch(sexo){
      case "M":
        console.log("sexo","Masculino");
        break;
      case "F":
        console.log("sexo","Feminino");
        break;
      default:
        console.log("sexo","Desconhecido");
    }

    const s = 'M';
    var masculino;

    if(s === 'M'){
      masculino = true;
    } else {
      masculino = false;
    }

    console.log("masculino", masculino);

    // Simplified way
    const masculino2 = (s === 'M');
    console.log("masculino 2",masculino2);

    const masculino3 = s === 'M';
    console.log("masculino 3",masculino3);

  </script>
</body>
</html>
