<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seção 04 - Aula 07</title>
</head>
<body>
  <h1>Seção 04 - Aula 07</h1>

  <script>
    // Operadores Relacionais

    // Os operadores mais comuns são:

    /*
      Igual a (==)
      Idêntico a (===)
      
      Diferente de (!=)
      Não idêntico a (!==)
      
      Maior que (>)
      Menor que (<)
      
      Maior ou igual a (>=)
      Menor ou igual a (<=)
    */

    var n1 = 54, n2 = 78;

    console.log("N1 == N2: ", n1 == n2 ); // false
    console.log("N1 != N2: ", n1 != n2 ); // true
    
    console.log("N1 === N2: ", n1 === n2 ); // false
    console.log("N1 !== N2: ", n1 !== n2 ); // true
    
    console.log("N1 > N2: ", n1 > n2 ); // false
    console.log("N1 < N2: ", n1 < n2 ); // true

    console.log("N1 >= N2: ", n1 >= n2 ); // false
    console.log("N1 <= N2: ", n1 <= n2 ); // true 

    if(n1 > n2) {
      console.log(n1 + "  é maior que " + n2);
    } else {
      console.log(n1 + " não é maior que " + n2);
    }

  </script>
</body>
</html>
