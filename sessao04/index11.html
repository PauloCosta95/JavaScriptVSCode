<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seção 04 - Aula 11</title>
</head>
<body>
  <h1>Seção 04 - Aula 11</h1>

  <script>
    /*---- Intervalos e Timeouts ----*/

    // Intervalo (setInterval)

    function escrever() {
      console.log("Executando a cada 5 segundos...");
    }

    setInterval(escrever, 5000); // executa a função escrever a cada 5 segundos

    // Timeout (setTimeout)

    function escreverTimeout() {
      console.log("Executando uma vez após 3 segundos...");
    }

    setTimeout(escreverTimeout, 3000); // executa a função escreverTimeout uma vez após 3 segundos


  </script>
</body>
</html>
