<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seção 04 - Aula 05</title>
</head>
<body>
  <h1>Seção 04 - Aula 05</h1>

  <script>
    // for
    for(var i = 0; i <= 10; i++) {
      console.log("Valor de i no for: ", i);
    }

    // while
    var j = 0;
    while(j <= 10) {
      console.log("Valor de j no while: ", j);
      j++;
    }

    // do...while
    var k = 0;
    do {
      console.log("Valor de k no do...while: ", k);
      k++;
    } while(k <= 10);

  </script>
</body>
</html>
