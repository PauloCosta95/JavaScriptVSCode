<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seção 04 - Aula 09</title>
</head>
<body>
  <h1>Seção 04 - Aula 09</h1>

  <script>
    // Operadores unário e ternario

    // Operador UNÁRIO
    var idade = 25;
    idade++; // operador unário de incremento
    console.log("Idade após incremento unário: ", idade);

    // Operador TERNÁRIO
    var sexo = 'M';
    if(sexo === 'M') {
      console.log("Sexo é Masculino");
    } else {
      console.log("Sexo é Feminino");
    }

    // Usando o operador ternário
    var resultado = (sexo === 'M') ? "Sexo é Masculino" : "Sexo é Feminino";
    console.log(resultado);

  </script>
</body>
</html>
