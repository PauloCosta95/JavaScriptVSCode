<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seção 04 - Aula 10</title>
</head>
<body>
  <h1>Seção 04 - Aula 10</h1>

  <script>
    // introdução a funções

    function somar(num1, num2) {
      var res = num1 + num2;
      console.log("Soma: ", res);
      return num1 + num2;
    }

    function mensagem() {
      return "Esta é a minha mensagem ";
    }

    function multiplicar(a, b) {
      return a * b;
    }
    
    var resultado = somar(45, 78);
    console.log("Resultado da função somar: ", resultado);
    somar(12, 34);


    var msg = mensagem();
    console.log(msg + "de retorno da função mensagem.");
    mensagem();

    var mult = multiplicar(6, 7);
    console.log("Resultado da multiplicação: ", mult);

  </script>
</body>
</html>
