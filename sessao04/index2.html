<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seção 04 - Aula 02</title>
</head>
<body>
  <h1>Seção 04 - Aula 02</h1>

  <script>
    var nome1 = "Geek University";
    var nome2 = 'JavaScript Básico';

    console.log(nome1 + ' - ' + nome2);

    nome1 = "Geek";
    nome2 = 42;

    console.log(nome1 + ' - ' + nome2);

    //principais tipos de dados
    var nome = "Geek University"; //string
    var idade = 18; //number (int, float, double)
    var altura = 1.72; //number (float, double)
    var activo = true; //boolean (true, false)
    var alunos = ['João', 'Maria', 'Pedro']; //array (vetor)
    var aluno = {nome: 'João', idade: 20, peso:58.4, activo:true, altura: 1.75}; //object (objeto)

    var peso; //undefined
    var time = null; //null

    console.log(nome);
    console.log(idade);
    console.log(altura);
    console.log(activo);
    console.log(alunos);
    console.log(aluno);
    console.log(peso);
    console.log(time);

  </script>
</body>
</html>
