<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seção 04 - Aula 04</title>
</head>
<body>
  <h1>Seção 04 - Aula 04</h1>

  <script>
    var num1 = 42;
    var num2 = 19;

    //soma 
    var res = num1 + num2;
    console.log("Num1: ", num1);
    console.log("Num2: ", num2);
    console.log("--------------");
    console.log("Num1:", num1, " + Num2:", num2, " = ", res);
    console.log("Soma: ", res);

    var num3 = 42, num4 = 19, nome = "Geek";
    var res2 = num3 + num4;
    console.log("Soma: ", res2);
    console.log("Nome: ", nome);


    var num5 = '39';
    res = num1 + num5;
    console.log("Soma: ", res);
  // subtração
    res = num1 - num2;
    console.log("Subtração: ", res);

    // multiplicação
    res = num1 * num2;
    console.log("Multiplicação: ", res);

    // divisão
    res = num1 / num2;
    console.log("Divisão: ", res);

    // módulo (resto da divisão)
    res = num1 % num2;
    console.log("Módulo: ", res);

    // incremento
    console.log("Num1 antes do incremento: ", num1);
    num1++;
    console.log("Num1 depois do incremento: ", num1); 
    console.log("Num1 depois do incremento number++: ", num1++); // primeiro mostra o valor antigo e depois incrementa
    console.log("Num1 depois do incremento ++number: ", ++num1); // primeiro incrementa e depois mostra o valor novo
    
    // decremento
    console.log("Num2 antes do decremento: ", num2);
    num2--;
    console.log("Num2 depois do decremento: ", num2);
    console.log("Num1 depois do decremento number--: ", num2--); // primeiro mostra o valor antigo e depois decrementa
    console.log("Num1 depois do decremento --number: ", --num2); // primeiro decrementa e depois mostra o valor novo


    var other = 10;
    console.log("Other ++ :", other++);
    console.log("Other:", other);
    console.log("Other -- ", other--);




  </script>
</body>
</html>
